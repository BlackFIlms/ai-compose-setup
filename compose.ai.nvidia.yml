# AI setup for work and everyday tasks.
# Maintainer: Blackfilms <blackfilms13@gmail.com>
# Don't modify sections with ENV or ARG - unless explicitly instructed to do so.
# Uncomment all strings, which starts with: ###+ , if something doesn't work.
# If you have some troubles, check settings.
# If settings are ok, call 8-800-DevOpsSaveYourAss
#
# First run:  docker compose -f compose.ai.nvidia.yml up strata        # the first start downloads the model (resumable)
# Common run: docker compose -f compose.ai.nvidia.yml up -d
#
# Strata on an NVIDIA card (RTX 20 to 50, and older cards with the cuda12 image). Needs the NVIDIA Container Toolkit on the host.
# Image: cuda13 for RTX 20-50 with driver 580 or newer; cuda12 for Pascal / Volta (GTX 10, Tesla P100, V100) or drivers 575-579.
# Images: ghcr.io/niko1221/strata (published from 0.2.1 on). To use one you built yourself: STRATA_IMAGE=strata:0.2.7-<flavor> docker compose up -d
#
# Hermes Agent
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `hermes` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/hermes/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  strata:
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.7-cuda13}
    container_name: strata
    restart: unless-stopped
    ports:
      - "${STRATA_BIND:-127.0.0.1}:${STRATA_PORT:-8080}:8080"      # 127.0.0.1 = this computer only. 0.0.0.0 = your network: keep the API key then.
    environment:
      MODEL: ${MODEL:-}                      # empty: Strata picks the one it recommends for your card, and says so in the log
      MODEL_PATH: ${MODEL_PATH:-}            # GGUF files you already have, as seen inside the container (mount them below)
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-}                # empty: fit to the card
      VISION: ${VISION:-off}                 # on: the model reads pictures (about 0.9 GB more to download)
      TUNE: ${TUNE:-skip}                    # quick: up to about 20 minutes, once, then kept
      API_KEY: ${API_KEY:-}                  # empty: made on the first start; docker exec strata strata launch --show-key
      # GPUS: "0,1"                          # several cards: which ones
    volumes:
      - strata-data:/data                    # the model, presets, tuning, the key. Survives updates of the image.
      # - /srv/gguf/IQ3_XXS:/models:ro       # GGUF files you already have (then also set MODEL_PATH: /models)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all                     # or: device_ids: ["0"]
              capabilities: [gpu]
    # the short form of the same: gpus: all
    ulimits:
      memlock: { soft: -1, hard: -1 }        # the engine pins tens of GB of RAM
    shm_size: 2gb
    stop_grace_period: 2m                    # the model drains and unloads on docker stop
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ":</dev/tcp/127.0.0.1/8080"]
      interval: 1m30s
      timeout: 60s
      retries: 10
      start_period: 600s                     # Maybe need tune it for you hardware and model (Watch how long strata loading model.)
      start_interval: 5s
    
  gateway:
    # build:                                     # You should clone original hermes-agenmt repository into this directory. After that uncomment HERMES_IMAGE in env.
    #   context: ./hermes-agent/
    #   dockerfile: ./Dockerfile
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.0}
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    depends_on:
      strata:
        condition: service_healthy
        restart: true
    volumes:
      - type: volume
        source: hermes
        target: /opt/data
      - type: bind
        source: ./hermes-config.yaml
        target: /opt/data/config.yaml
        #read_only: true
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]

  dashboard:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.0}
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - type: volume
        source: hermes
        target: /opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    # Localhost-only. For remote access, tunnel via `ssh -L 9119:localhost:9119`.
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
volumes:
  strata-data:
  hermes:
