# AI setup for work and everyday tasks.
# Maintainer: Blackfilms <blackfilms13@gmail.com>
# Don't modify sections with ENV or ARG - unless explicitly instructed to do so.
# Uncomment all strings, which starts with: ###+ , if something doesn't work.
# If you have some troubles, check settings.
# If settings are ok, call 8-800-DevOpsSaveYourAss
#
# First run:  docker compose -f compose.ai.strata_hermes.nvidia.yml up strata        # the first start downloads the model (resumable)
# Common run: docker compose -f compose.ai.strata_hermes.nvidia.yml up -d
#
# Strata on an NVIDIA card (RTX 20 to 50, and older cards with the cuda12 image). Needs the NVIDIA Container Toolkit on the host.
# Image: cuda13 for RTX 20-50 with driver 580 or newer; cuda12 for Pascal / Volta (GTX 10, Tesla P100, V100) or drivers 575-579.
# Images: ghcr.io/niko1221/strata (published from 0.2.1 on). To use one you built yourself: STRATA_IMAGE=strata:0.2.7-<flavor> docker compose up -d
#
# Hermes Agent
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `hermes` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/hermes/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
# hermes WARNING hermes_plugins.platforms__matrix.adapter: Matrix: dropping encrypted messages this process has no E2EE decryptor. 
#    Install with: pip install 'mautrix[encryption]' asyncpg aiosqlite  (requires libolm C library), then set MATRIX_E2EE_MODE=optional (or required). Without it, messages in encrypted rooms never reach the agent.
#    apt install python3-matrix-common python3-asyncpg python3-aiosqlite
#    RECOMENDATION: customise docker image. Use via derictive FROM nousresearch/hermes-agent:v0.23.0
#                   OR rebuild from repository: docker build -t custom-hermes-agent:v0.23.0 -f custom-hermes-agent.Dockerfile ./hermes-agent
#                   If you want rebuild from repository - you should modify Dockerfile!
#
# n8n
#
# After run n8n connect to hermes via dashboard->MCP->Add server(On top) and add connection to your n8n manually with API(bearer) token auth.
# And url: http://n8n:5678/mcp-server/http
# If you don't need it, just disable it.
# 
services:
  strata:
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.7-cuda13}
    container_name: strata
    restart: unless-stopped
    ports:
      - "${STRATA_BIND:-127.0.0.1}:${STRATA_PORT:-8080}:8080"      # 127.0.0.1 = this computer only. 0.0.0.0 = your network: keep the API key then.
    environment:
      MODEL: ${MODEL:-}                      # empty: Strata picks the one it recommends for your card, and says so in the log
      MODEL_PATH: ${MODEL_PATH:-}            # GGUF files you already have, as seen inside the container (mount them below)
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-}                # empty: fit to the card
      VISION: ${VISION:-off}                 # on: the model reads pictures (about 0.9 GB more to download)
      TUNE: ${TUNE:-skip}                    # quick: up to about 20 minutes, once, then kept
      API_KEY: ${API_KEY:-}                  # empty: made on the first start; docker exec strata strata launch --show-key
      # GPUS: "0,1"                          # several cards: which ones
    volumes:
      - strata-data:/data                    # the model, presets, tuning, the key. Survives updates of the image.
      # - /srv/gguf/IQ3_XXS:/models:ro       # GGUF files you already have (then also set MODEL_PATH: /models)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all                     # or: device_ids: ["0"]
              capabilities: [gpu]
    # the short form of the same: gpus: all
    ulimits:
      memlock: { soft: -1, hard: -1 }        # the engine pins tens of GB of RAM
    shm_size: 2gb
    stop_grace_period: 2m                    # the model drains and unloads on docker stop
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", ":</dev/tcp/127.0.0.1/8080"]
      interval: 1m30s
      timeout: 60s
      retries: 10
      start_period: 5m                     # Maybe need tune it for you hardware and model (Watch how long strata loading model.)
      start_interval: 5s
    
  gateway:
    # build:                                     # You should clone original hermes-agenmt repository into this directory. After that uncomment HERMES_IMAGE in env.
    #   context: ./hermes-agent/
    #   dockerfile: ./Dockerfile
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.0}
    container_name: hermes
    restart: unless-stopped
    #network_mode: host
    depends_on:
      strata:
        condition: service_healthy
        restart: true
    volumes:
      - type: volume
        source: hermes
        target: /opt/data
      - type: bind
        source: ./hermes-config.yaml
        target: /opt/data/config.yaml
        #read_only: true
    environment:
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-true}
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      - HERMES_DASHBOARD_HOST=${HERMES_DASHBOARD_HOST:-0.0.0.0}
      - HERMES_DASHBOARD_PORT=${HERMES_DASHBOARD_PORT:-9119}
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN:-token}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-user}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:-hash}
      # - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-pass}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-secret}
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # TG
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      # - TELEGRAM_HOME_CHANNEL=${TELEGRAM_HOME_CHANNEL}
      # - TELEGRAM_HOME_CHANNEL_NAME=${TELEGRAM_HOME_CHANNEL_NAME}
      # - TELEGRAM_CRON_THREAD_ID=${TELEGRAM_CRON_THREAD_ID}
      # - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      # - TELEGRAM_WEBHOOK_PORT=${TELEGRAM_WEBHOOK_PORT}
      # - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      # - TELEGRAM_PROXY=${TELEGRAM_PROXY:-socks5://127.0.0.1:9050}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # MATRIX
      # - MATRIX_HOMESERVER=${MATRIX_HOMESERVER:-https://matrix.example.org}
      # - MATRIX_USER_ID=${MATRIX_USER_ID:-@hermes:matrix.example.org}
      # - MATRIX_PASSWORD=${MATRIX_PASSWORD:-***}
      # - MATRIX_REQUIRE_MENTION=${MATRIX_REQUIRE_MENTION:-true}
      # - MATRIX_ALLOWED_USERS=${MATRIX_ALLOWED_USERS:-@alice:matrix.org}
      # - MATRIX_HOME_ROOM=${MATRIX_HOME_ROOM:-!abc123:matrix.org}
      # - MATRIX_ALLOWED_ROOMS=${MATRIX_ALLOWED_ROOMS:-!abc123:matrix.org}
      # - MATRIX_FREE_RESPONSE_ROOMS=${MATRIX_FREE_RESPONSE_ROOMS:-!abc123:matrix.org,!def456:matrix.org}
      # - MATRIX_IGNORE_USER_PATTERNS=${MATRIX_IGNORE_USER_PATTERNS:-'^@telegram_,^@whatsapp_'}
      # - MATRIX_PROCESS_NOTICES=${MATRIX_PROCESS_NOTICES:-false}
      # - MATRIX_SESSION_SCOPE=${MATRIX_PROCESS_NOTICES:-room}       # recommended for stable project-room context
      # - MATRIX_AUTO_THREAD=${MATRIX_AUTO_THREAD:-true}
      # - MATRIX_DM_MENTION_THREADS=${MATRIX_DM_MENTION_THREADS:-false}
      # - MATRIX_REACTIONS=${MATRIX_REACTIONS:-true}          # default: true — emoji reactions during processing
      # - MATRIX_ALLOW_ROOM_MENTIONS=${MATRIX_ALLOW_ROOM_MENTIONS:-false}
      # - MATRIX_E2EE_MODE=${MATRIX_E2EE_MODE:-off}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]

  # dashboard:
  #   image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.0}
  #   container_name: hermes-dashboard
  #   restart: unless-stopped
  #   network_mode: host
  #   depends_on:
  #     gateway:
  #       condition: service_started
  #   volumes:
  #     - type: volume
  #       source: hermes
  #       target: /opt/data
  #   environment:
  #     - HERMES_UID=${HERMES_UID:-10000}
  #     - HERMES_GID=${HERMES_GID:-10000}
  #   # Localhost-only. For remote access, tunnel via `ssh -L 9119:localhost:9119`.
  #   command: ["dashboard", "--host", "127.0.0.1", "--no-open"]

  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION}
    container_name: n8n-sandbox-certs
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION}
    container_name: n8n-sandbox-api
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    env_file: .env
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Never publish 8080/9090 to the host on an internet-facing server.
    # n8n reaches this container by service name, over the default Compose network.

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION}
    container_name: n8n-sandbox-runner-1
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    env_file: .env
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    # Never expose this container's ports publicly â it runs privileged Docker-in-Docker.

  n8n:
    image: docker.io/n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    depends_on:
      sandbox-api:
        condition: service_healthy
    ports:
      - '5678:5678' # the only port that should be internet-facing
    env_file: .env
    volumes:
      - n8n-data:/home/node/.n8n

  runners:
    image: ghcr.io/n8n-io/runners:${N8N_VERSION}
    container_name: n8n-runners
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      # Idle runners exit and are relaunched on demand (per the task-runners docs)
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'
    # Runs user code from Code nodes. Never publish this container's ports.

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: n8n-searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    # Internal-only: n8n reaches it by service name. Never publish its port.

volumes:
  strata-data:
  hermes:
  n8n-data:
  sandbox-tls:
